<!DOCTYPE html>
<html lang='pt-BR'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Vídeos com HTML 5</title>
</head>
<body>
    <h1>Inserindo vídeos hospedados localmente</h1>
    <p>Este vídeo está hospedado no meu próprio servidor.</p>
    <video src="midia/meu_video.mp4" width="500" controls></video> <!-- reduzir o tamanho do vídeo por aqui não muda o tamanho dele em espaço utilizado.-->

    <!-- Maneira ideal abaixo -->
     <video width="500" poster="imagens/coca-cola.jpg" controls> <!-- poster é a capa do vídeo. -->
        <source src="midia/meu_video.mp4" type="video/mp4">
        <!-- <source src="midia/meu_video.m4v" type="video/mp4"> -->
        <!-- <source src="midia/meu_video.webm" type="video/webm"> -->
        <!-- <source src="midia/meu_video.ogv" type="video/ogv"> -->
        <p>Seu navegador não tem compatibilidade com reprodução de vídeos.</p>
     </video>
     <h1>Inserindo vídeos do YouTube</h1>

     <!-- Conteúdo copiado do YouTube -->
     <iframe width="560" height="315" src="https://www.youtube.com/embed/HzCzsOhEWl8?si=I4HJQgeDitghsHd1" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

     <h1>Inserindo vídeos do Vimeo</h1>
     <!-- Quando do vídeo do Guanabara, o Vimeo permitia maiores personalizações ao colocar o vídeo, como remover no do título, do autor, mudar cor, etc -->
     <iframe src="https://player.vimeo.com/video/5892711?badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479" width="560" height="315" frameborder="0" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share" title="The Pingu Show - Title Sequence"></iframe>
</body>
</html>
